<body>
    <!-- Uygulama yüklenene kadarki gösterge: markalı zemin, fener alevi halkası
         (renkler styles.css'teki token değişkenlerinden). Compose canvas'ı
         açılınca bu öğeler arkada kalır.
         Uygulamanın asıl içeriği <canvas>'a çizildiği için arama motorlarının
         okuyabileceği tek gerçek metin buradaki ad + açıklamadır. -->
    <div class="kk-yukleniyor">
        <svg width="40" height="40" viewBox="0 0 50 50" role="progressbar" aria-label="Kuzey Kapısı yükleniyor">
            <circle class="kk-yukleniyor-iz" cx="25" cy="25" r="20" stroke-width="4" fill="none"/>
            <circle class="kk-yukleniyor-yay" cx="25" cy="25" r="20" stroke-width="4" fill="none"
                    stroke-linecap="round" stroke-dasharray="90 125"/>
        </svg>
        <h1 class="kk-yukleniyor-baslik">Kuzey Kapısı</h1>
        <p class="kk-yukleniyor-metin">Sinop'un tarihini, kültürünü, doğasını ve lezzetlerini yapay zeka destekli rehberlerle keşfedin.</p>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
