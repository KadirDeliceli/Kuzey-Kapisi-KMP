<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mobil tarayıcı çubuğu da gece denizi zemininde (KaranlikLacivert) açılsın. -->
    <meta name="theme-color" content="#0B1E2D">
    <title>Kuzey Kapısı</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Uygulama yüklenene kadarki gösterge: markalı zemin, fener alevi halkası
         (renkler styles.css'teki token değişkenlerinden). Compose canvas'ı
         açılınca bu öğeler arkada kalır. -->
    <div class="kk-yukleniyor" role="progressbar" aria-label="Kuzey Kapısı yükleniyor">
        <svg width="40" height="40" viewBox="0 0 50 50" aria-hidden="true">
            <circle class="kk-yukleniyor-iz" cx="25" cy="25" r="20" stroke-width="4" fill="none"/>
            <circle class="kk-yukleniyor-yay" cx="25" cy="25" r="20" stroke-width="4" fill="none"
                    stroke-linecap="round" stroke-dasharray="90 125"/>
        </svg>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
